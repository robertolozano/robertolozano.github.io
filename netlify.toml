# Netlify build configuration.
#
# Settings here take precedence over the ones in the Netlify UI, so the repo is
# the source of truth. The site is a fully static Next.js export — `next build`
# with `output: 'export'` writes plain HTML/CSS/JS to `out/`, which Netlify
# serves directly. No Next.js runtime or serverless functions are involved.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next 16 requires Node >= 20.9; Netlify's default is older.
  NODE_VERSION = "20"

# Long-cache the fingerprinted build assets. Next hashes these filenames, so a
# new deploy produces new URLs and never serves a stale bundle.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
